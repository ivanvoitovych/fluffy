## Custom (branded) domains — ONE catch-all :443 server that serves EVERY custom
## host, choosing the TLS cert at handshake time from Redis by SNI. No nginx reload
## when a new domain comes online. Drop into /etc/nginx/conf.d/ (loaded before
## sites-enabled). Named primary sites (dev.ivi.to, …) match by server_name first
## and win; this default_server catches every other host (the custom domains).
##
## Requires (installed by scripts/install-openresty-ubuntu24.sh):
##   - `lua_shared_dict fluffy_tls 16m;` in the http block (L1 per-worker cert cache)
##   - `resolver` in conf.d/00-fluffy-tuning.conf
## Certs are written to Redis (localhost:6379) by the control-plane issuance job
## (acme.sh --deploy-hook): `tls:cert:<host>` = PEM fullchain, `tls:key:<host>` = PEM key.
##
## A host we have no cert for is refused at BOTH levels: the handshake keeps the self-signed
## placeholder, and the request phase answers 404 (`fluffy_domains` below) instead of proxying
## to the app.

# Host gate shared by both servers below. "Is this host one of ours?" is answered with "does
# the cert store hold a cert for it?" — the same fact the handshake already keys on, so there
# is no second list to keep in sync: a domain is gated in from the moment its cert is issued.
#
# Why this exists: the handshake always failed closed, but the REQUEST phase did not. `location
# /` proxied every unmatched Host straight to the app, which rendered the full site under it —
# so any stale A record somebody else leaves pointing at this IP became a crawlable copy of the
# site on a certificate that cannot match the hostname. The cert warning is not the gate: a
# client that clicks through it, and a crawler that does not check, both got a 200.
#
# `init_by_lua_block` is an http-context directive and must stay UNIQUE across conf.d — if
# another file ever needs init-time Lua, merge it into this block rather than adding a second.
init_by_lua_block {
  local _M = {}

  -- The request's Host, lowercased and stripped of any :port — i.e. what nginx's own $host
  -- holds, which is also the key the cert store and the app's record keys use. With no Host
  -- header at all $host falls back to server_name ("_"), which no cert is stored under, so
  -- such a request is refused like any other unknown host.
  function _M.host()
    local h = ngx.var.host
    if not h or h == "" then return "" end
    return (string.gsub(string.lower(h), ":%d+$", ""))
  end

  -- L1: the fluffy_tls dict the handshake fills — normally already warm for this very
  -- connection. L2: `EXISTS tls:cert:<host>` on the DB pool (6378), verdict cached 300s
  -- positive / 60s negative. The L2 lookup is NOT redundant with the handshake: sessions
  -- resume for a day (ssl_session_timeout in 00-fluffy-tuning.conf) and a resumed handshake
  -- never calls the cert hook, so the dict entry (1h) can be gone while the connection is
  -- still legitimate. The negative cache is what keeps a scanner sweeping hostnames down to
  -- one EXISTS per host per minute instead of one per request.
  --
  -- safe_set, never set: these verdicts share the 16m CERT dict, and `set` evicts LRU entries
  -- to make room — a flood of junk hosts must not be able to push a cert out. Out of memory
  -- just means we ask Redis again next time.
  function _M.known(host)
    if not host or host == "" then return false end
    local dict = ngx.shared.fluffy_tls
    if dict:get("crt:" .. host) then return true end
    local cached = dict:get("known:" .. host)
    if cached ~= nil then return cached == 1 end

    local redis = require "resty.redis"
    local r = redis:new()
    r:set_timeout(200)
    if not r:connect("127.0.0.1", 6378) then
      return false -- fail closed, exactly as the handshake does on a Redis miss
    end
    local exists, err = r:exists("tls:cert:" .. host)
    r:set_keepalive(10000, 100)
    if not exists or exists == ngx.null then
      ngx.log(ngx.ERR, "fluffy_domains exists(", host, "): ", err or "no result")
      return false
    end
    local ok = exists == 1
    dict:safe_set("known:" .. host, ok and 1 or 0, ok and 300 or 60)
    return ok
  end

  fluffy_domains = _M
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  # Placeholder cert so nginx can boot the ssl listener; the Lua block overrides it
  # per-connection. An unknown/unissued SNI keeps this self-signed cert → the browser
  # rejects it (fails closed) — the abuse gate is the ABSENCE of a stored cert.
  ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
  ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

  ssl_certificate_by_lua_block {
    local ssl  = require "ngx.ssl"
    local host = ssl.server_name()
    if not host or host == "" then
      return -- no SNI → placeholder cert, browser rejects
    end
    host = string.lower(host)

    -- L1: per-worker shared dict (avoids a Redis hit every handshake).
    local dict = ngx.shared.fluffy_tls
    local pem  = dict:get("crt:" .. host)
    local key  = dict:get("key:" .. host)

    if not pem or not key then
      -- L2: the DB Redis pool on localhost:6378 (noeviction + persistent — NOT the 6379 cache pool,
      -- which runs allkeys-lfu and would EVICT certs). Fast + fail-safe: 200ms timeout, keepalive;
      -- on any miss/error we just return (placeholder cert served → fails closed).
      local redis = require "resty.redis"
      local r = redis:new()
      r:set_timeout(200)
      local ok = r:connect("127.0.0.1", 6378)
      if not ok then return end
      pem = r:get("tls:cert:" .. host)
      key = r:get("tls:key:" .. host)
      r:set_keepalive(10000, 100)
      if not pem or pem == ngx.null or not key or key == ngx.null then
        return -- no cert issued for this host yet
      end
      dict:set("crt:" .. host, pem, 3600)
      dict:set("key:" .. host, key, 3600)
    end

    -- Replace the placeholder with the per-SNI cert for this connection.
    local ok, err = ssl.clear_certs()
    if not ok then ngx.log(ngx.ERR, "fluffy_tls clear_certs: ", err) return end

    local der_cert, e1 = ssl.cert_pem_to_der(pem)
    if not der_cert then ngx.log(ngx.ERR, "fluffy_tls cert pem→der: ", e1) return end
    local ok1, e2 = ssl.set_der_cert(der_cert)
    if not ok1 then ngx.log(ngx.ERR, "fluffy_tls set_der_cert: ", e2) return end

    local der_key, e3 = ssl.priv_key_pem_to_der(key)
    if not der_key then ngx.log(ngx.ERR, "fluffy_tls key pem→der: ", e3) return end
    local ok2, e4 = ssl.set_der_priv_key(der_key)
    if not ok2 then ngx.log(ngx.ERR, "fluffy_tls set_der_priv_key: ", e4) return end
  }

  access_log off;
  error_log /var/log/nginx/custom-domains.error.log crit;
  root /workspace/urlicer-space/public;

  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Every refusal answers from here: 404 (the status that gets an accidentally indexed URL
  # DROPPED from a search index — 421/444 do not), plus a noindex for the crawl that is already
  # under way. `always`, or add_header would skip a non-2xx. Named, so it cannot be requested
  # from outside, and deliberately NOT gated itself — gating it would loop the internal redirect.
  location @unknown_host {
    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type text/plain;
    return 404 "Not found\n";
  }

  location / {
    # The host gate. In the ACCESS phase on purpose: it runs after the rewrite-phase `if`
    # below but before the content phase, so neither the proxy_pass nor try_files off disk
    # can serve an unknown host.
    access_by_lua_block {
      if not fluffy_domains.known(fluffy_domains.host()) then
        return ngx.exec("@unknown_host")
      end
    }

    proxy_set_header Host $host;                 # the custom host — ShortUrlMiddleware keys on it
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass_request_headers on;

    if (!-f $request_filename) {
      proxy_pass http://urlicer_app;
      break;
    }
    try_files $uri $uri/ @app;
  }
  location @app { proxy_pass http://urlicer_app; }
}

# Port 80 for custom domains: serve the ACME HTTP-01 challenge from the shared webroot
# (acme.sh writes tokens there when issuing/renewing a cert), redirect everything else to
# HTTPS. This is the :80 default_server — the stock Debian `default` site's default_server
# must be retired (scripts/install-acme-ubuntu24.sh does this). Named primary sites keep
# their own :80 blocks and win by server_name; this catches the custom (unmatched) hosts.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # No access log (no client IPs), errors at crit only, as in the HTTPS block above.
  access_log off;
  error_log /var/log/nginx/custom-domains.error.log crit;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;              # acme.sh --webroot /var/www/acme
    default_type "text/plain";
    try_files $uri =404;
  }

  location @unknown_host {
    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type text/plain;
    return 404 "Not found\n";
  }

  location / {
    # Same gate as the HTTPS block — an unknown host gets 404 rather than a redirect to a
    # certificate that cannot match it. Both branches live in Lua because `return 301` is a
    # rewrite-phase directive: it would answer before any access-phase gate ever ran.
    access_by_lua_block {
      local host = fluffy_domains.host()
      if not fluffy_domains.known(host) then
        return ngx.exec("@unknown_host")
      end
      return ngx.redirect("https://" .. host .. ngx.var.request_uri, ngx.HTTP_MOVED_PERMANENTLY)
    }
  }
}
